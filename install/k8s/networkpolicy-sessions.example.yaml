# OPTIONAL example: keep cluster session pods away from your in-cluster services.
#
# NOT part of kustomization.yaml and NOT applied by deploy.sh. Nothing in Blerg
# depends on it; read it, adapt it, then apply it yourself:
#
#   kubectl apply -f install/k8s/networkpolicy-sessions.example.yaml
#
# WHY. Session pods run agent-driven code (builds, tests, plugins, whatever the
# repository does). By default they can open connections to any address the
# cluster network routes to, which includes the Postgres StatefulSet, core, the
# board and anything else running in your cluster. The pods are already
# hardened (see CLUSTER-RUNTIME.md: no service-account token, no capabilities,
# non-root, seccomp) but the pod network is open unless you restrict it.
#
# WHAT THIS DOES. For every pod in the `blerg-runner-sessions` namespace it
# denies all ingress, and limits egress to:
#   1. DNS, to kube-dns in kube-system (UDP and TCP 53);
#   2. the runner Service in the `blerg` namespace, on port 8080 (the pod's
#      websocket back to the runner, BLERG_RUNNER_INTERNAL_URL);
#   3. the public internet, over any port: git hosts, model APIs, the plugin
#      marketplace, package registries. This is 0.0.0.0/0 and ::/0 MINUS the
#      private, loopback, link-local (cloud metadata, 169.254.169.254) and
#      CGNAT ranges listed under `except`.
# Everything else, notably every other pod and Service inside the cluster and
# the node addresses, is unreachable from a session pod.
#
# CHECK BEFORE APPLYING, because this depends on YOUR cluster:
#   * A CNI that ENFORCES NetworkPolicy. MicroK8s' default (Calico) does; k3s'
#     default flannel does not by itself, kind's default does not. On a CNI
#     without enforcement this object is accepted and silently does nothing.
#   * The CIDRs. The `except` lists are the RFC 1918 / RFC 6598 / link-local
#     ranges. If your pod or Service CIDR sits outside those (uncommon), add it,
#     and if you WANT sessions to reach some internal host (a private git
#     server, a package mirror, a local inference server) remove or narrow the
#     matching range or add an allow rule for it.
#   * The kube-dns selector. CoreDNS carries `k8s-app: kube-dns` in kube-system
#     on most distributions; adjust if yours differs (NodeLocal DNSCache, for
#     example, listens on a link-local address that the `except` would block:
#     add that address as an ipBlock on port 53).
#   * The runner selector below (`app: blerg-runner` in `blerg`) matches
#     install/k8s/runner-deployment.yaml.
#   * Board-started sessions that call the board API from inside the pod
#     (BLERG_BOARD_URL) need the extra rule shown commented out at the bottom.
#   * Verify with a throwaway session: `curl` to https://github.com should
#     work, `curl` to http://blerg-core.blerg.svc:8080 should time out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blerg-sessions-egress
  namespace: blerg-runner-sessions
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules: nothing needs to connect INTO a session pod.
  ingress: []
  egress:
    # 1. DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. The runner service (pod -> runner websocket / HTTP).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: blerg
          podSelector:
            matchLabels:
              app: blerg-runner
      ports:
        - protocol: TCP
          port: 8080
    # 3. General internet egress, minus everything private.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8  # scrub:allow (generic private ranges, not a host)
              - 172.16.0.0/12  # scrub:allow (generic private ranges, not a host)
              - 192.168.0.0/16  # scrub:allow (generic private ranges, not a host)
              - 100.64.0.0/10  # scrub:allow (generic private ranges, not a host)
              - 169.254.0.0/16
              - 127.0.0.0/8
        - ipBlock:
            cidr: ::/0
            except:
              - fc00::/7
              - fe80::/10
              - ::1/128
    # Optional: board-started sessions that use the board API from the pod.
    # - to:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: blerg
    #       podSelector:
    #         matchLabels:
    #           app: blerg-board
    #   ports:
    #     - protocol: TCP
    #       port: 8080
