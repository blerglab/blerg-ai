name: workspace explorer platform security
on:
  pull_request:
    paths:
      - 'runner/internal/daemon/workspace*.go'
      - 'runner/internal/hostgit/**'
      - 'runner/internal/workspacepolicy/**'
      - 'scripts/*workspace*macos*.py'
      - '.github/workflows/workspace-explorer.yml'
  workflow_dispatch:
  push:
    branches: ['ci/**']
permissions:
  contents: read
jobs:
  descriptor-traversal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: runner/go.mod
      - name: Evidence validator regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts -p test_workspace_macos_gate.py -v
      - name: Native macOS security gate
        if: runner.os == 'macOS'
        run: python3 scripts/test-workspace-macos.py
      - name: Descriptor, cursor, cancellation and Git adversarial tests
        if: runner.os == 'Linux'
        working-directory: runner
        env:
          GOWORK: 'off'
        shell: bash
        run: |
          set -o pipefail
          go test -race -json -p 1 -timeout 45m ./internal/daemon -run 'TestWorkspace' -count=1 | tee ../workspace-daemon.json
          go test -race -json -p 1 -timeout 45m ./internal/hostgit -count=1 | tee ../workspace-hostgit.json
      - name: Preserve platform security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-security-${{ runner.os }}
          path: |
            workspace-daemon.json
            workspace-hostgit.json
            workspace-macos-evidence/
            !workspace-macos-evidence/**/private-*/tmp/**
      - name: Mount crossing gate in a private user and mount namespace
        if: runner.os == 'Linux'
        working-directory: runner
        env:
          GOWORK: 'off'
        run: |
          # Ubuntu 24.04 runners restrict unprivileged user namespaces through AppArmor.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount go test -p 1 -timeout 45m ./internal/daemon -run '^TestWorkspaceExplorer(SameDeviceBindMount|OtherDeviceMount|Device)$' -v -count=1
