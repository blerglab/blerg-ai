# Overrides for the demo stack (video/demo/demo.sh with BLERG_DEMO_MODE=docker), applied on top
# of install/desktop/docker-compose.yml under the compose project `blerg-demo`:
#   - the project name already gives the volumes, the default network and the containers their
#     own names (blerg-demo_*), so a real desktop install on the same machine is never touched;
#   - the sandbox network has a pinned name in the desktop file, so it is renamed here;
#   - the images are named blerg-demo-* so `demo.sh down` can find and remove them;
#   - the ports come from the demo's env file (28081-28083 by default).
services:
  blerg-core:
    image: blerg-demo-core:latest
  blerg-board:
    image: blerg-demo-board:latest
    environment:
      # The demo daemon runs sessions on its host with the scripted engine: no sandbox image.
      BLERG_BOARD_RUNNER_RUNTIME: daemon
  blerg-runner:
    image: blerg-demo-runner:latest

networks:
  sandbox:
    name: blerg-demo-sandbox
