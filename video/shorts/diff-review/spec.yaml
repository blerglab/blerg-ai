# The diff-review short: in-session diffs and code review.
# Built by video/build/short.py from the takes video/shorts/diff-review/capture.mjs records.
# Scenes cut the takes between marks; waits inside a scene are sped up and labeled on screen.
slug: diff-review
title: Review the agent's diff without leaving the session

# Which take each output is cut from (video/out/takes/<slug>-<take>.webm).
formats:
  16x9: {take: desktop}
  9x16: {take: phone}

title_card:
  title: Code review, in the session
  subtitle: Comment on a line. The agent fixes it.
  seconds: 2.6

end_card:
  title: Blerg
  lines:
    - Open source · self-hosted
    - Every agent, one place
  seconds: 3.4

# Optional. A music file (path relative to this folder, or under $BLERG_VIDEO_ASSETS); missing or
# empty = no music. It is looped, faded and ducked under the voice-over.
music:
  file: ""
  volume: 0.14

# Optional voice-over, from each scene's `vo` text. Providers: elevenlabs (needs ELEVENLABS_API_KEY
# in the environment; voice from voice_id or ELEVENLABS_VOICE_ID), command (BLERG_VIDEO_TTS_CMD),
# files (each scene's vo_file). `short.py --silent` (or no provider) builds captions only.
voice:
  provider: elevenlabs
  voice_id: ""
  model: eleven_multilingual_v2

# A wait is played this many seconds long at most (it shows "sped up xN" meanwhile).
wait_seconds: 3.0

# A scene's optional `camera` per format: [[cx, cy, width] at its start, [...] at its end], in the
# take's pixels; the view eases from one to the other. No camera = the whole frame.
scenes:
  - from: open
    to: sent
    camera: {16x9: [[960, 540, 1920], [920, 640, 1560]]}
    caption: Ask the agent for a change.
    pos: {16x9: top}
    vo: Ask the agent for a change, right in the session.
  - from: sent
    to: diff-posted
    camera: {16x9: [[920, 640, 1560], [920, 560, 1560]]}
    caption: It does the work and publishes a diff.
    vo: It does the work, and publishes the diff.
  - from: diff-posted
    to: comment-1
    camera: {16x9: [[960, 540, 1920], [1060, 500, 1700]]}
    caption: Open it. Comment on the exact line.
    vo: Open it, and comment on the exact line you care about.
  - from: comment-1
    to: submitted
    camera: {16x9: [[1060, 500, 1700], [1060, 560, 1700]]}
    caption: Ask for as many changes as you like, then submit.
    vo: Add as many as you like, then submit the review.
  - from: submitted
    to: fixed
    camera: {16x9: [[930, 420, 1600], [930, 420, 1600]]}
    caption: The agent fixes each one and answers it.
    vo: The agent makes each change and answers each comment.
  - from: fixed
    to: new-code
    caption: The new version of the diff…
    vo: The new version of the diff
  - from: new-code
    to: end
    caption: …carries your threads, answered.
    vo: carries your threads along, answered.
