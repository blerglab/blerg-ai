# TEMPLATE ONLY — do not apply this file as-is and do not commit real values.
#
# deploy.sh creates this Secret for you; set AGENT_SECRET_EXTERNAL=1 to manage
# it yourself. deploy.sh writes BLERG_RUNNER_DAEMON_TOKEN (copied from
# blerg-secrets) plus any engine credential you pinned via SECRET_* in .env,
# reusing whatever is already live for the rest. Every engine credential is
# optional: users add their own in Settings and the runner injects them per
# session, so a default install needs none of the values below.
#
# Credentials for cluster-runtime session pods (see CLUSTER-RUNTIME.md).
# Lives in blerg-runner-sessions — a DIFFERENT namespace than blerg-secrets
# (which is in `blerg`) — because a pod's secretKeyRef only ever resolves a
# Secret in its own namespace, and session pods run in
# blerg-runner-sessions (see cluster-runtime.yaml).
#
# Every key here is `optional: true` on the pod side (internal/server/
# k8sjobs.go's CreateSessionJob) — set only the ones for the engine(s) you
# want cluster runtime to support. GET /api/cluster/status reports back
# which engines it can actually see credentials for, computed by checking
# the keys below are present and non-empty (this is what BLERG_RUNNER_KEY/
# ANTHROPIC_API_KEY/etc. below map to in engines terms):
#   ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN present → "claude"
#   CODEX_AUTH_JSON present                              → "codex"
#   HERMES_ENV_CONTENTS present                          → "hermes"
# OpenClaw has no entry here — it isn't wired into cluster sessions at all
# (not installed in the pod image, no credential key exists for it).
#
# Create it for real with (values below are examples, not defaults):
#
#   kubectl create secret generic blerg-runner-agent \
#     --namespace blerg-runner-sessions \
#     --from-literal=BLERG_RUNNER_DAEMON_TOKEN="$(kubectl -n blerg get secret blerg-secrets -o jsonpath='{.data.BLERG_RUNNER_DAEMON_TOKEN}' | base64 -d)" \
#     --from-literal=ANTHROPIC_API_KEY="sk-ant-..." \
#     --from-file=CODEX_AUTH_JSON=$HOME/.codex/auth.json \
#     --from-file=HERMES_ENV_CONTENTS=$HOME/.hermes/.env \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# (omit any --from-literal/--from-file for an engine you don't want to
# support in the cluster — its key just won't exist, and
# detectAvailableEngines treats a missing key as "not available", not an
# error.)
apiVersion: v1
kind: Secret
metadata:
  name: blerg-runner-agent
  namespace: blerg-runner-sessions
type: Opaque
stringData:
  # Required — every cluster session pod authenticates to blerg-runner's
  # /ws/daemon with this. Reuse the SAME value as blerg-secrets'
  # BLERG_RUNNER_DAEMON_TOKEN in the `blerg` namespace (the server checks
  # one token, not per-namespace tokens).
  BLERG_RUNNER_DAEMON_TOKEN: "change-me-daemon-token"

  # Every key below is commented out ON PURPOSE. A key present with an empty
  # value is NOT the same as an absent key: detectAvailableEngines and the
  # pod's `optional: true` env refs both treat present-but-empty as "set"
  # (M11). Uncomment only the ones you are giving a real value.

  # Optional — set the git remote credential if your repos aren't public.
  # BLERG_RUNNER_GIT_TOKEN: "ghp-example"

  # Optional, alternative Claude billing modes — set ONE.
  # ANTHROPIC_API_KEY: "sk-ant-example"
  # CLAUDE_CODE_OAUTH_TOKEN: "example-oauth-token"

  # Optional — enables the "codex" engine for cluster sessions. Contents of
  # a working ~/.codex/auth.json (JSON, not a bare token).
  # CODEX_AUTH_JSON: "{}"

  # Optional — enables the "hermes" engine for cluster sessions. Contents of
  # a working ~/.hermes/.env (whatever provider key(s) Hermes needs).
  # HERMES_ENV_CONTENTS: "EXAMPLE_PROVIDER_KEY=example"
