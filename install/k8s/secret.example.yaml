# TEMPLATE ONLY — do not apply this file as-is and do not commit real values.
#
# deploy.sh generates the real `blerg-secrets` Secret for you (from env vars,
# or by generating random values with `openssl rand`) via
# `kubectl create secret generic ... --dry-run=client -o yaml | kubectl apply -f -`.
# This file just documents the shape of that Secret and is NOT listed as a
# resource in kustomization.yaml, so `kubectl apply -k` never applies it.
#
# To create it by hand instead of using deploy.sh, copy this file, fill in
# real values, and `kubectl apply -f` your copy (keep your copy out of git).
apiVersion: v1
kind: Secret
metadata:
  name: blerg-secrets
  namespace: blerg
type: Opaque
stringData:
  # Postgres superuser password (POSTGRES_USER is "blerg", set in configmap.yaml).
  POSTGRES_PASSWORD: "change-me"

  # Full DSNs, one logical database per service, same postgres instance.
  DATABASE_URL_CORE: "postgres://blerg:change-me@postgres:5432/blerg_core?sslmode=disable"
  DATABASE_URL_BOARD: "postgres://blerg:change-me@postgres:5432/blerg_board?sslmode=disable"
  BLERG_RUNNER_DATABASE_URL: "postgres://blerg:change-me@postgres:5432/blerg_runner?sslmode=disable"

  # Shared bootstrap key: board and runner both register with core using this.
  BLERG_CORE_REGISTER_KEY: "change-me-register-key"

  # Static shared secret core validates on its internal endpoints; runner
  # presents this same value back as BLERG_RUNNER_CORE_INTERNAL_KEY.
  BLERG_CORE_INTERNAL_KEY: "change-me-internal-key"
  # core's local KMS key — must be base64 of exactly 32 random bytes, e.g.
  # `openssl rand -base64 32`.
  BLERG_CORE_LOCAL_KEY: "change-me-32-bytes-base64-encoded=="
  # Optional — core's own GitHub App/PAT reconciliation. Empty disables it.
  BLERG_CORE_GITHUB_TOKEN: ""

  # Board-only secrets. Board has no password login of its own any more —
  # humans authenticate against blerg-core (see core/docs/CONFIG.md).
  BLERG_BOARD_SERVICE_KEY: "change-me-service-key"
  # Encrypts board automation tokens at rest — must be base64 of exactly 32
  # random bytes, e.g. `openssl rand -base64 32`. Losing or changing it makes
  # stored automation tokens unreadable (they must be re-entered).
  BLERG_BOARD_SECRET_KEY: "change-me-32-bytes-base64-encoded=="
  ANTHROPIC_API_KEY: ""

  # Shared between board and runner: board calls runner's HTTP API with this.
  BLERG_RUNNER_KEY: "change-me-runner-key"

  # Presented by the host-run runner daemon on /ws/daemon (see README).
  BLERG_RUNNER_DAEMON_TOKEN: "change-me-daemon-token"

  # Optional — pairs with BLERG_RUNNER_GITHUB_ORG in configmap.yaml to enable
  # the repo picker's GitHub org listing. Omit both for local-repos-only.
  BLERG_RUNNER_GITHUB_TOKEN: ""
