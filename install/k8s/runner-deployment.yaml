# This is the in-cluster blerg-runner SERVER only (runner/Dockerfile.server).
# The actual agent-session daemon is NOT deployed here — it runs on a human's
# workstation (their own `claude` CLI install, auth, and tmux), and connects
# in to this service's /ws/daemon over the Ingress from outside the cluster,
# exactly as it does against the desktop stack. See README.md.
#
# blerg-runner-agent-launcher (below) is always created, but carries zero
# permissions on its own — cluster runtime (ephemeral per-session agent Jobs)
# only works once cluster-runtime.yaml's Role/RoleBinding grant it access in
# the blerg-runner-sessions namespace. See CLUSTER-RUNTIME.md. Creating the
# inert ServiceAccount unconditionally means enabling cluster runtime never
# requires re-rolling this Deployment just to change serviceAccountName.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blerg-runner-agent-launcher
  namespace: blerg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blerg-runner
  namespace: blerg
  labels:
    app: blerg-runner
spec:
  replicas: 1
  # Additive migrations allow the old replica to serve until the surge is ready.
  # The overlap must stay short: the runner keeps routing in memory (daemon, session and browser
  # sockets, waiters), so two pods split it. The old pod therefore exits at once on SIGTERM: no
  # preStop hook, no drain, no graceful shutdown (unlike core and the board). Do not add one
  # without first moving that state out of process.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: blerg-runner
  template:
    metadata:
      labels:
        app: blerg-runner
    spec:
      # ReadWriteOnce permits concurrent mounts on one node. Co-locate the surge
      # with the serving pod so rollout does not wait on a cross-node attachment.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: blerg-runner
              topologyKey: kubernetes.io/hostname
      serviceAccountName: blerg-runner-agent-launcher
      # fsGroup hands a volume's files to the runner's group (65532, the container's user below), so
      # a freshly provisioned, root-owned volume is writable; only re-chowned when its root differs.
      # It works only on volume types with ownership management (most CSI and block volumes): an
      # in-tree hostPath volume, such as MicroK8s' microk8s-hostpath class, ignores it. There, if the
      # runner cannot write /data, fix the claim once with the helper pod in README.md ("Runner
      # data volume") rather than a root initContainer on every start.
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: blerg-runner
          image: "${REGISTRY}/blerg-runner:${TAG}"
          ports:
            - containerPort: 8080
            # The MCP gateway's own listener (BLERG_RUNNER_MCP_GW_ADDR). It is
            # reached only through the internal-only blerg-runner-mcp-gateway
            # Service below; ingress.yaml must never route to it (deploy_test.sh
            # asserts that).
            - name: mcp-gateway
              containerPort: 8090
          env:
            - name: BLERG_RUNNER_ALLOW_LEGACY_DESKTOPS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_ALLOW_LEGACY_DESKTOPS, optional: true }
            - name: BLERG_RUNNER_MAX_PARALLEL_CHILDREN
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MAX_PARALLEL_CHILDREN, optional: true }
            - name: BLERG_RUNNER_MAX_CHILD_STARTS_PER_HOUR
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MAX_CHILD_STARTS_PER_HOUR, optional: true }
            - name: BLERG_RUNNER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blerg-secrets
                  key: BLERG_RUNNER_DATABASE_URL
            - name: BLERG_RUNNER_DAEMON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: blerg-secrets
                  key: BLERG_RUNNER_DAEMON_TOKEN
            - name: BLERG_RUNNER_KEY
              valueFrom:
                secretKeyRef:
                  name: blerg-secrets
                  key: BLERG_RUNNER_KEY
            - name: BLERG_CORE_REGISTER_KEY
              valueFrom:
                secretKeyRef:
                  name: blerg-secrets
                  key: BLERG_CORE_REGISTER_KEY
            # Same value as core's own BLERG_CORE_INTERNAL_KEY — runner
            # presents this back to core's internal endpoints.
            - name: BLERG_RUNNER_CORE_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: blerg-secrets
                  key: BLERG_CORE_INTERNAL_KEY
            - name: BLERG_CORE_URL
              valueFrom:
                configMapKeyRef:
                  name: blerg-config
                  key: BLERG_CORE_URL
            - name: BLERG_CORE_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: blerg-config
                  key: BLERG_CORE_PUBLIC_URL
            - name: BLERG_RUNNER_SELF_URL
              valueFrom:
                configMapKeyRef:
                  name: blerg-config
                  key: BLERG_RUNNER_SELF_URL
            - name: BLERG_RUNNER_DATA_DIR
              valueFrom:
                configMapKeyRef:
                  name: blerg-config
                  key: BLERG_RUNNER_DATA_DIR
            # Optional — comma-separated CORS allowlist for runner's own
            # browser WebSocket endpoint; unset means same-origin only.
            - name: BLERG_RUNNER_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_ALLOWED_ORIGINS, optional: true }
            # Optional — enables the repo picker's GitHub org listing (see
            # RepoLister in cmd/server/main.go) and doubles as the default
            # git clone base for cluster-runtime sessions when
            # BLERG_RUNNER_AGENT_GIT_BASE isn't set explicitly. Neither is
            # required: without BLERG_RUNNER_GITHUB_ORG, the repo picker just
            # shows local/checked-out repos only.
            - name: BLERG_RUNNER_GITHUB_ORG
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_GITHUB_ORG, optional: true }
            - name: BLERG_RUNNER_GITHUB_TOKEN
              valueFrom:
                secretKeyRef: { name: blerg-secrets, key: BLERG_RUNNER_GITHUB_TOKEN, optional: true }
            # Optional — turns on GET /metrics (Prometheus): a scraper presents this as a bearer token.
            # Absent key = the endpoint answers 404. See docs/telemetry.md.
            - name: BLERG_RUNNER_METRICS_TOKEN
              valueFrom:
                secretKeyRef: { name: blerg-secrets, key: BLERG_RUNNER_METRICS_TOKEN, optional: true }
            # Optional — the cluster's shared Hermes provider configuration (a Hermes config.yaml
            # fragment), written by deploy.sh from HERMES_PROVIDERS_FILE. Absent Secret = Hermes
            # on the cluster works as before. See CLUSTER-RUNTIME.md, "Shared Hermes providers".
            - name: BLERG_RUNNER_HERMES_PROVIDERS
              valueFrom:
                secretKeyRef: { name: blerg-hermes-providers, key: config.yaml, optional: true }
            # Optional — the Claude model list's source (see configmap.yaml).
            # Absent key = the public Claude Code catalog; "" = built-in only.
            - name: BLERG_RUNNER_MODEL_CATALOG_URL
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MODEL_CATALOG_URL, optional: true }
            # Optional — the marketplaces always-on plugins may come from
            # (see configmap.yaml). Re-checked here and again in each session
            # pod before anything is installed.
            - name: BLERG_RUNNER_PLUGIN_MARKETPLACES
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_PLUGIN_MARKETPLACES, optional: true }
            # ── MCP gateway (optional) ──────────────────────────────────────
            # Where sessions with MCP connections (and crons) reach their tools.
            # GW_ADDR is the listener, GW_URL the address session pods dial (the
            # internal Service below). configmap.yaml sets both; unset GW_ADDR
            # turns the gateway off. The allow-lists and limits are documented
            # in configmap.yaml and default to empty / built-in.
            - name: BLERG_RUNNER_MCP_GW_ADDR
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MCP_GW_ADDR, optional: true }
            - name: BLERG_RUNNER_MCP_GW_URL
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MCP_GW_URL, optional: true }
            - name: BLERG_RUNNER_MCP_GW_PUBLIC
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MCP_GW_PUBLIC, optional: true }
            - name: BLERG_RUNNER_TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_TRUSTED_PROXIES, optional: true }
            # Optional — the board cron runs use (see configmap.yaml): the failure
            # card's target and the built-in board connection's endpoint.
            - name: BLERG_RUNNER_BOARD_URL
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_BOARD_URL, optional: true }
            - name: BLERG_RUNNER_BOARD_MCP_URL
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_BOARD_MCP_URL, optional: true }
            - name: BLERG_RUNNER_MCP_ALLOW_HTTP_HOSTS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MCP_ALLOW_HTTP_HOSTS, optional: true }
            - name: BLERG_RUNNER_MCP_ALLOW_PRIVATE_HOSTS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MCP_ALLOW_PRIVATE_HOSTS, optional: true }
            - name: BLERG_RUNNER_MCP_CALL_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MCP_CALL_TIMEOUT_SECONDS, optional: true }
            - name: BLERG_RUNNER_MCP_MAX_CONCURRENT
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MCP_MAX_CONCURRENT, optional: true }
            - name: BLERG_RUNNER_MCP_MAX_RESULT_BYTES
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MCP_MAX_RESULT_BYTES, optional: true }
            # ── File limits (optional; absent = 100 / 500 / 1024 MiB) ───────
            - name: BLERG_RUNNER_MAX_FILE_MB
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MAX_FILE_MB, optional: true }
            - name: BLERG_RUNNER_MAX_SESSION_UPLOADS_MB
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MAX_SESSION_UPLOADS_MB, optional: true }
            - name: BLERG_RUNNER_MAX_SESSION_ARTIFACTS_MB
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MAX_SESSION_ARTIFACTS_MB, optional: true }
            # ── Cluster runtime (optional) ──────────────────────────────────
            # Every var below is `optional: true`: unset until an operator
            # follows CLUSTER-RUNTIME.md, at which point NewJobManagerFromEnv
            # (runner/internal/server/k8sjobs.go) picks them up on next
            # restart with no manifest changes needed. BLERG_RUNNER_AGENT_IMAGE
            # is the on/off switch — every other cluster-runtime var is inert
            # without it.
            - name: BLERG_RUNNER_AGENT_IMAGE
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_AGENT_IMAGE, optional: true }
            - name: BLERG_RUNNER_WORKSPACE_STORAGE_CLASS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_WORKSPACE_STORAGE_CLASS, optional: true }
            - name: BLERG_RUNNER_WORKSPACE_DEFAULT_CLASS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_WORKSPACE_DEFAULT_CLASS, optional: true }
            - name: BLERG_RUNNER_NATIVE_HISTORY
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_NATIVE_HISTORY, optional: true }
            - name: BLERG_RUNNER_NATIVE_HISTORY_STORAGE_CLASS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_NATIVE_HISTORY_STORAGE_CLASS, optional: true }
            - name: BLERG_RUNNER_NATIVE_HISTORY_SIZE
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_NATIVE_HISTORY_SIZE, optional: true }
            - name: BLERG_RUNNER_NATIVE_HISTORY_MAX_CLAIMS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_NATIVE_HISTORY_MAX_CLAIMS, optional: true }
            - name: BLERG_RUNNER_NATIVE_HISTORY_RETENTION_HOURS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_NATIVE_HISTORY_RETENTION_HOURS, optional: true }
            - name: BLERG_RUNNER_AGENT_NAMESPACE
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_AGENT_NAMESPACE, optional: true }
            - name: BLERG_RUNNER_AGENT_SECRET
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_AGENT_SECRET, optional: true }
            - name: BLERG_RUNNER_OAUTH_SECRET_NAME
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_OAUTH_SECRET_NAME, optional: true }
            - name: BLERG_RUNNER_AGENT_GIT_BASE
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_AGENT_GIT_BASE, optional: true }
            - name: BLERG_RUNNER_INTERNAL_URL
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_INTERNAL_URL, optional: true }
            - name: BLERG_RUNNER_MAX_SESSIONS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_MAX_SESSIONS, optional: true }
            - name: BLERG_RUNNER_SANDBOX_CLUSTER_CHILDREN
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_SANDBOX_CLUSTER_CHILDREN, optional: true }
            - name: BLERG_RUNNER_WEBHOOK_ALLOW_PRIVATE
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_WEBHOOK_ALLOW_PRIVATE, optional: true }
            - name: BLERG_RUNNER_POD_TTL_SECONDS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_POD_TTL_SECONDS, optional: true }
            - name: BLERG_RUNNER_POD_IDLE_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_POD_IDLE_TIMEOUT_SECONDS, optional: true }
            - name: BLERG_RUNNER_POD_CPU_REQUEST
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_POD_CPU_REQUEST, optional: true }
            - name: BLERG_RUNNER_POD_MEM_REQUEST
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_POD_MEM_REQUEST, optional: true }
            - name: BLERG_RUNNER_POD_CPU_LIMIT
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_POD_CPU_LIMIT, optional: true }
            - name: BLERG_RUNNER_POD_MEM_LIMIT
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_POD_MEM_LIMIT, optional: true }
            - name: BLERG_RUNNER_POD_TERMINATION_GRACE_SECONDS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_POD_TERMINATION_GRACE_SECONDS, optional: true }
            - name: BLERG_RUNNER_POD_TTL_AFTER_FINISHED_SECONDS
              valueFrom:
                configMapKeyRef: { name: blerg-config, key: BLERG_RUNNER_POD_TTL_AFTER_FINISHED_SECONDS, optional: true }
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            # /data (BLERG_RUNNER_DATA_DIR) is the persistent volume mounted
            # below — every write runner does (agentconfig.go, publish.go,
            # artifacts.go) goes there, so the rest of the root filesystem
            # stays read-only.
            readOnlyRootFilesystem: true
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - name: data
              mountPath: /data
      # The runner's files (published and attached files, agent-config bundles, mockups) must
      # survive a restart: the database indexes them. deploy.sh creates the claim before this
      # Deployment is applied (runner-data-pvc.yaml).
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: blerg-runner-data
---
apiVersion: v1
kind: Service
metadata:
  name: blerg-runner
  namespace: blerg
  labels:
    app: blerg-runner
spec:
  selector:
    app: blerg-runner
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# The MCP gateway, INTERNAL ONLY: a ClusterIP Service that session pods dial
# (BLERG_RUNNER_MCP_GW_URL in configmap.yaml). It is deliberately a separate
# Service from blerg-runner, so nothing that routes to the runner's web port
# can reach the gateway, and ingress.yaml must never reference it or port
# 8090 (install/k8s/deploy_test.sh fails if it does). Never change this to
# NodePort or LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: blerg-runner-mcp-gateway
  namespace: blerg
  labels:
    app: blerg-runner
spec:
  type: ClusterIP
  selector:
    app: blerg-runner
  ports:
    - name: mcp-gateway
      port: 8090
      targetPort: mcp-gateway
