const pl=d.plan;h+=`<div class="fil">`+[['All',pl[0][1]+pl[3][1]],['Shipped',pl[1][1]],['Moved out',pl[2][1]],['Unplanned',pl[3][1]]].map((a,i)=>`<button class="${i==0?'on':''}">${a[0]}<b>${a[1]}</b></button>`).join('')+`</div><h2>THRUSTS</h2><div class="grid">`+d.th.map(t=>`<div class="th pt"><div class="tt">${t[0]}<span>${t[1]} of ${t[2]}</span></div><div class="mini"><i style="width:${100*t[1]/t[2]}%;background:var(--lichen)"></i></div>${t[3]?`<div class="pl">${t[3]} unplanned</div>`:''}</div>`).join('')+`<div class="th pt"><div class="tt">Target<span>${d.target}</span></div><div class="pl">${d.ver}</div></div><div class="th pt"><div class="tt">Gates<span>${d.gate}</span></div><div class="pl">To final</div></div></div><h2>DECISIONS</h2><div class="rows">${d.dec.map(q=>`<div class="dr"><span class="k">${q[0]}</span><span>${q[1]}</span><span class="pl" style="margin:0">${q[2]}</span></div>`).join('')}</div><h2>MOVED OUT</h2><div class="rows">${d.out.map(q=>`<div class="dr"><span>${q}</span></div>`).join('')}</div>`;m.innerHTML=h;wnav();wbars()}

function wbars(){m.querySelectorAll('[data-bar]').forEach(b=>{const p=b.dataset.bar.split('|');const r=(l,c,n)=>`<div class="hr2"><span class="n"><i class="ld" style="background:${c}"></i>${l}</span><span class="hs">${n}</span></div>`;b.onmouseenter=e=>hov(e,`<b>${p[0]}</b><div class="hs">${p[1]} cards</div>`+r('Done','var(--lichen)',p[2])+r('To test','#2e8b63',p[3])+r('In work','var(--sel)',p[4])+r('Waiting','var(--stone)',p[5]));b.onmouseleave=hideH});m.querySelectorAll('[data-ev]').forEach(b=>{const p=b.dataset.ev.split('|');b.onmouseenter=e=>hov(e,`<b>${p[0]}</b><div class="hs">${p[1]}</div><div class="n">${p[2]}</div>`);b.onmouseleave=hideH})}
function hov(e,html){const h=document.getElementById('hc');h.innerHTML=html;const r=e.currentTarget.getBoundingClientRect();h.hidden=false;h.style.left=Math.min(r.left,innerWidth-340)+'px';h.style.top=Math.min(r.bottom+6,innerHeight-h.offsetHeight-8)+'px'}
const gh=g=>`<b>${names[g]}, 0.6.0</b>`+S.filter(t=>t[0]==g).slice(0,6).map(t=>{const d=cnt(t[2]);return `<div class="hr"><span class="n">${t[1]}</span><span class="mini">${bar(d)}</span><span class="hs">${d.done+d.test}/${t[2].length}</span></div>`}).join('');
const NT={Attention:[['Workflows',3],['Attention view',2]],UX:[['Engineering reports',5],['User-defined tabs',4],['Insights',3]],Foundation:[['Upgrade and release',4],['Policies',3],['Host controls cluster',3]]};let pf='all';
function project(){const all=S.flatMap(t=>t[2]),ad=cnt(all);const conf=Math.round(100*ad.done/all.length);const later={Attention:3,UX:5,Foundation:2};
let h=nav('project')+`<div class="head"><h1>Blerg</h1><span class="sub">The IDE for AI collaboration</span></div><div class="stack">${bar(ad)}</div><div class="fil">`+[['all','All',''],['shipped','Shipped',H.flatMap(x=>x[2]).length],['now','0.6.0',S.length],['next','0.7.0',N.length],['later','Later',10]].map(a=>`<button data-pf="${a[0]}" class="${pf==a[0]?'on':''}">${a[1]}${a[2]!==''?`<b>${a[2]}</b>`:''}</button>`).join('')+`</div>`;
if(pf=='shipped'){H.forEach(r=>{h+=`<h2>${r[0].toUpperCase()} · ${r[1].toUpperCase()}</h2><div class="grid">${r[2].map(x=>`<button class="th" data-r="${x[0]}"><div class="tt">${x[0]}<span>${x[1]}</span></div><div class="pl">${x[2]}</div></button>`).join('')}</div>`})}else Object.keys(names).forEach(g=>{const ts=S.filter(t=>t[0]==g),cs=ts.flatMap(t=>t[2]),d=cnt(cs),nx=N.filter(x=>gm(x[1])==g),p=Math.round(100*(d.done+d.test)/cs.length);h+=`<h2>${names[g].toUpperCase()}</h2><div class="grid">`;
if(pf=='all')h+=`<button class="th" data-pf="shipped" data-hs="${g}"><div class="tt">Shipped<span>13 releases</span></div><div class="pl">${past[g].join(' · ')}</div></button>`;
if(pf=='all')h+=`<button class="th" data-nav2="slice" data-h="${g}"><div class="tt">0.6.0<span>${p}% built</span></div><div class="mini">${bar(d)}</div><div class="pl">${ts.length} thrusts · Thu or Fri</div></button>`;
if(pf=='now')ts.forEach(t=>{const e=cnt(t[2]);h+=`<button class="th" data-i="${S.indexOf(t)}"><div class="tt">${t[1]}<span>${e.done} of ${t[2].length}</span></div><div class="mini">${bar(e)}</div></button>`});
if(pf=='all')h+=`<div class="th pt fut" data-hn="${g}"><div class="tt">0.7.0<span>${nx.length} planned</span></div><div class="pl">${nx.slice(0,2).map(x=>theme(x[1])).join(' · ')}</div></div>`;
if(pf=='next')nx.forEach(x=>{h+=`<div class="th pt fut" title="${x[1]}"><div class="tt"><span class="k">${x[0]}</span></div><div class="pl">${theme(x[1])}</div></div>`});
if(pf=='all'||pf=='later')h+=`<div class="th pt fut" data-hl="${later[g]}"><div class="tt">Later<span>${later[g]} ideas</span></div><div class="pl">Not committed</div></div>`;
h+=`</div>`});
m.innerHTML=h;wnav();m.querySelectorAll('[data-h]').forEach(b=>{b.onmouseenter=e=>hov(e,gh(b.dataset.h));b.onmouseleave=hideH});m.querySelectorAll('[data-hs]').forEach(b=>{const g=b.dataset.hs;b.onmouseenter=e=>hov(e,`<b>${names[g]}, shipped</b><div class="hst"><div><b>13</b><span>releases</span></div><div><b>10</b><span>on time</span></div><div><b>3</b><span>late</span></div></div><div class="hs">Typically 2 days between releases</div>`);b.onmouseleave=hideH});m.querySelectorAll('[data-hn]').forEach(b=>{const g=b.dataset.hn,nx=N.filter(x=>gm(x[1])==g),th=NT[g];b.onmouseenter=e=>hov(e,`<b>${names[g]}, 0.7.0</b>`+th.map(t=>`<div class="hr2"><span class="n">${t[0]}</span><span class="hs">${t[1]} cards</span></div>`).join('')+`<div class="hs">${nx.length} planned, none started</div>`);b.onmouseleave=hideH});m.querySelectorAll('[data-hl]').forEach(b=>{const n=b.dataset.hl;b.onmouseenter=e=>hov(e,`<b>Later</b><div class="hst"><div><b>${n}</b><span>ideas</span></div><div><b>0</b><span>committed</span></div></div><div class="hs">Oldest idea is 14 days old</div>`);b.onmouseleave=hideH});m.querySelectorAll('[data-r]').forEach(b=>{const n=b.dataset.r,d=RD[n],x=H.flatMap(r=>r[2]).find(r=>r[0]==n);b.onclick=()=>{hideH();rel=n;draw()};b.onmouseenter=e=>hov(e,d?`<b>${n}</b><div class="hs">${x[1]} · ${d.ver}</div><div class="hst"><div><b>${d.plan[1][1]}</b><span>shipped</span></div><div><b>${d.plan[2][1]}</b><span>moved out</span></div><div><b>${d.plan[3][1]}</b><span>unplanned</span></div></div><div class="hs">${d.gate}</div>`:`<b>${n}</b><div class="hs">${x[1]}</div><div class="hs">Before the plan of record, so only its date and notes are known</div>`);b.onmouseleave=hideH});m.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{pf=b.dataset.pf;project()});m.querySelectorAll('[data-nav2]').forEach(b=>b.onclick=()=>{v='slice';draw()});m.querySelectorAll('[data-i]').forEach(b=>{const t=S[+b.dataset.i];b.onclick=()=>openT(t[1]);b.onmouseenter=e=>peek(e,t);b.onmouseleave=hideH})}
draw();</script></html>
