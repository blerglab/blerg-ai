apiVersion: v1
kind: Service
metadata:
  name: blerg-core-live-data
spec:
  type: ClusterIP
  selector: {app: blerg-core}
  ports:
    - {name: live-data, port: 8443, targetPort: live-data}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blerg-core-live-data
spec:
  podSelector:
    matchLabels: {app: blerg-core}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8090}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: blerg}
          podSelector:
            matchLabels: {app: blerg-runner}
      ports:
        - {protocol: TCP, port: 8443}
---
apiVersion: v1
kind: Service
metadata:
  name: blerg-runner-live-data
spec:
  type: ClusterIP
  selector: {app: blerg-runner}
  ports:
    - {name: live-data, port: 8443, targetPort: live-data}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blerg-runner-live-data
spec:
  podSelector:
    matchLabels: {app: blerg-runner}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8090}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: blerg}
          podSelector:
            matchLabels: {app: blerg-core}
      ports:
        - {protocol: TCP, port: 8443}
