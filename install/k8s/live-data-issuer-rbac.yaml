apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blerg-core-live-data
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [blerg-live-data-issuer]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blerg-core-live-data
subjects:
  - kind: ServiceAccount
    name: default
    namespace: blerg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blerg-core-live-data
